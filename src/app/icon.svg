<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="hl" cx="25%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#FFEFF5" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFEFF5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sh" cx="80%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#2A0F4E" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2A0F4E" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip">
      <rect width="512" height="512" rx="116"/>
    </clipPath>
  </defs>
  <!-- Background: Hot Pink #FF1E7A -->
  <rect width="512" height="512" rx="116" fill="#FF1E7A"/>
  <!-- Depth gradients -->
  <rect width="512" height="512" rx="116" fill="url(#hl)"/>
  <rect width="512" height="512" rx="116" fill="url(#sh)"/>
  <!-- F glyph: Cream #FFEFF5, bold, tight tracking, centered -->
  <text
    x="68"
    y="390"
    font-family="-apple-system, BlinkMacSystemFont, 'Arial Black', 'Helvetica Neue', sans-serif"
    font-weight="900"
    font-size="340"
    fill="#FFEFF5"
    letter-spacing="-24"
  >F</text>
  <!-- Lime dot accent: #BDFF1E -->
  <circle cx="316" cy="395" r="46" fill="#BDFF1E"/>
</svg>
